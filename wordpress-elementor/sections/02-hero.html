<!-- ===================== HERO ===================== -->
<section class="ep-redesign-hero">
  <div class="ep-redesign-hero__glow-a" aria-hidden="true"></div>
  <div class="ep-redesign-hero__glow-b" aria-hidden="true"></div>
  <div class="ep-redesign-hero__grid ep-redesign-container">
    <div class="ep-redesign-hero__copy">
      <div class="ep-redesign-hero__badge">
        <span class="ep-redesign-hero__badge-dot" aria-hidden="true"></span>100% Électrique · Made in Morocco
      </div>
      <h1 class="ep-redesign-hero__title">Conduisez le<br>futur avec <span class="ep-redesign-hero__title-accent">E-Power</span></h1>
      <p class="ep-redesign-hero__lede">Scooters électriques intelligents, économiques et écologiques. Zéro essence, zéro bruit, 100% de plaisir — pensés pour la ville marocaine.</p>
      <div class="ep-redesign-hero__actions">
        <a href="#ep-redesign-models" class="ep-redesign-btn ep-redesign-btn--accent ep-redesign-btn--accent-glow ep-redesign-btn--lg">
          Voir les scooters
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <button type="button" class="ep-redesign-btn ep-redesign-btn--ghost ep-redesign-btn--md">
          <span class="ep-redesign-btn__play">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>
          </span>
          Voir la vidéo
        </button>
      </div>
      <div class="ep-redesign-hero__stats">
        <div>
          <div class="ep-redesign-hero__stat-value"><span data-ep-redesign-counter data-ep-redesign-target="240">0</span><span class="ep-redesign-hero__stat-value-accent">km</span></div>
          <div class="ep-redesign-hero__stat-label">Autonomie max</div>
        </div>
        <div class="ep-redesign-hero__stat-divider" aria-hidden="true"></div>
        <div>
          <div class="ep-redesign-hero__stat-value"><span data-ep-redesign-counter data-ep-redesign-target="3">0</span></div>
          <div class="ep-redesign-hero__stat-label">Modèles · ZL9/ZL3/SY</div>
        </div>
        <div class="ep-redesign-hero__stat-divider" aria-hidden="true"></div>
        <div>
          <div class="ep-redesign-hero__stat-value">0<span class="ep-redesign-hero__stat-value-accent">DH</span></div>
          <div class="ep-redesign-hero__stat-label">Carburant</div>
        </div>
      </div>
    </div>

    <div class="ep-redesign-hero__media">
      <div class="ep-redesign-hero__media-glow" aria-hidden="true"></div>
      <div class="ep-redesign-hero__frame">
        <div class="ep-redesign-hero__frame-spot" aria-hidden="true"></div>
        <div class="ep-redesign-media-placeholder" aria-hidden="true">
          <div>
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#3E3E45" stroke-width="1.4"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l2-7h2M5 10h6l3 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div>[ PHOTO SHOWROOM ]</div>
          </div>
        </div>
        <img class="ep-redesign-hero__img" src="images/hero-scooter.jpg" alt="Scooter électrique E-Power en showroom" data-ep-redesign-fallback>
      </div>
    </div>
  </div>
</section>
